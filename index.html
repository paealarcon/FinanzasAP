<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FinanzasAP" />
<link rel="apple-touch-icon" href="apple-touch-icon.jpeg" />
<link rel="icon" href="icon-512.jpeg" />
<title>FinanzasAP</title>

<!-- Tailwind (CDN, sin build) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Babel standalone (v7, fijo): transpila el JSX de app.jsx directo en el navegador -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<style>
  html, body { height: 100%; margin: 0; background: #0f172a; }
  #root { height: 100%; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  .pt-safe { padding-top: max(env(safe-area-inset-top), 48px); }
</style>
<script>
  window.addEventListener('error', function (e) {
    var msg = (e.error && e.error.stack) || e.message || 'Error desconocido';
    document.getElementById('root').innerHTML =
      '<div style="color:#fff;background:#7f1d1d;padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;height:100%;overflow:auto;">' +
      'ERROR:\n\n' + msg + '</div>';
  });
</script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx" data-presets="react"></script>
</body>
</html>
