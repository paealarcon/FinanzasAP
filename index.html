<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mango" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-512.png" />
<title>Mango</title>

<!-- Tailwind (CDN, sin build) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin onerror="window.__mangoLoadError('React')"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin onerror="window.__mangoLoadError('ReactDOM')"></script>

<!-- Babel standalone (v7, fijo): transpila el JSX de app.jsx directo en el navegador -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin onerror="window.__mangoLoadError('Babel')"></script>

<style>
  html, body { height: 100%; margin: 0; background: #0f172a; }
  #root { height: 100%; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  .pt-safe { padding-top: max(calc(env(safe-area-inset-top) + 29px), 110px); }
</style>
<script>
  function showFatalError(msg) {
    document.getElementById('root').innerHTML =
      '<div style="color:#fff;background:#7f1d1d;padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;height:100%;overflow:auto;">' +
      'ERROR:\n\n' + msg +
      '<br><br><button onclick="location.reload()" style="background:#fff;color:#7f1d1d;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;">Reintentar</button>' +
      '</div>';
  }
  window.__mangoLoadError = function (lib) {
    showFatalError(
      'No se pudo cargar "' + lib + '" desde internet.\n\n' +
      'Esto suele pasar con señal débil (4G/5G) o wifi inestable.\n\n' +
      'Tocá "Reintentar" o revisá tu conexión y volvé a abrir la app.'
    );
  };
  window.addEventListener('error', function (e) {
    var raw = (e.error && e.error.stack) || e.message || 'Error desconocido';
    if (raw === 'Script error.' || raw === 'Script error') {
      showFatalError(
        'Ocurrió un error al cargar un recurso externo (React/Babel) y el navegador ' +
        'no muestra más detalle por seguridad.\n\n' +
        'Esto suele resolverse solo reintentando — probablemente fue un corte breve de señal.'
      );
    } else {
      showFatalError(raw);
    }
  });
</script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx" data-presets="react"></script>
</body>
</html>
